<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style03.css">
    <title>EX03</title>
</head>
<body>


    <div class="palate-container">
        <div class="NamedColor">
            <div>Named Color</div>
        </div>

        <div class="HEXColor">
            <div>HEX Color</div>
        </div>

        <div class="RGBColor">
            <div>RGB Color</div>
        </div>

        <div class="RGBAColor">
            <div>RGBA Color</div>
        </div>

        <div class="Opacity">
            <div>Opacity</div>
            <p>makes the whole element transparent, including its children.</p>
        </div>

        <div class="RGBAtrans">
            <div>RGBA Transparency</div>
            <p>makes only the background color transparent.</p>
        </div>
    </div>
</body>
</html>
